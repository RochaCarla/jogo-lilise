<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Casa Criativa</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #241d44;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      /* aviso para girar o celular: o jogo é em paisagem */
      #rotate {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #241d44;
        color: #fff3e0;
        font-family: 'Trebuchet MS', Verdana, sans-serif;
        text-align: center;
        padding: 24px;
      }
      #rotate .phone {
        font-size: 72px;
        animation: gira 1.8s ease-in-out infinite;
      }
      #rotate p {
        font-size: 22px;
        font-weight: bold;
        margin: 0;
      }
      @keyframes gira {
        0%,
        25% {
          transform: rotate(0deg);
        }
        65%,
        100% {
          transform: rotate(90deg);
        }
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">
      <div class="phone">📱</div>
      <p>Gire o celular para jogar! ✨</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
